version: '3.8'

services:
  temperature-api:
    build: ./temperature-api
    ports:
      - "8081:8081"
    restart: always

  smart-home-api:
    build: ./smart_home
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      - db

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
